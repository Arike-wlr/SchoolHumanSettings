<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3d2b1f">
<title>校拟设定簿</title>
<script>
// 离线模式：重写导航链接
if (location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('a[href]').forEach(function(a) {
      var h = a.getAttribute('href');
      var map = {
        '/m': 'm-index.html',
        '/m/worldview': 'm-worldview.html',
        '/m/relations': 'm-relations.html',
        '/m/documents': 'm-documents.html'
      };
      if (map[h]) a.href = map[h];
    });
  });
}
</script>
<style>
  :root {
    --bg: #f5f0eb;
    --text: #3d322b;
    --text-light: #8c7b6e;
    --accent: #8b5e3c;
    --accent-light: #c49a6c;
    --border: #e0d5c7;
    --shadow: 0 2px 12px rgba(60,40,20,.06);
    --radius: 14px;
    --font-serif: 'Georgia', 'Noto Serif SC', serif;
    --font-sans: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font-sans);
    background: linear-gradient(180deg, #3d2b1f 0%, #5a3e2b 40%, #f5f0eb 40%, #f5f0eb 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部品牌区 */
  .brand {
    text-align: center;
    padding: 40px 20px 10px;
    padding-top: max(40px, calc(env(safe-area-inset-top, 0px) + 16px));
  }
  .brand .app-icon {
    width: 80px;
    height: 80px;
    border-radius: 18px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    overflow: hidden;
  }
  .brand .app-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .brand h1 {
    font-family: var(--font-serif);
    font-size: 1.4rem;
    color: #f5ede4;
    font-weight: 500;
    letter-spacing: .06em;
  }
  .brand .subtitle {
    font-size: .72rem;
    color: rgba(245,237,228,.55);
    margin-top: 4px;
  }

  /* 卡片网格 */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 24px 18px;
    width: 100%;
    max-width: 420px;
    flex: 1;
  }

  .card {
    background: var(--bg-card, #fffef9);
    border-radius: var(--radius);
    padding: 24px 14px 18px;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 2px 16px rgba(60,40,20,.07);
    transition: transform .18s, box-shadow .18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    opacity: .7;
  }
  .card:nth-child(1)::before { background: #c49a6c; }
  .card:nth-child(2)::before { background: #6b8e7b; }
  .card:nth-child(3)::before { background: #7b6b8e; }
  .card:nth-child(4)::before { background: #8e7b6b; }

  .card:active {
    transform: scale(.96);
    box-shadow: 0 1px 8px rgba(60,40,20,.1);
  }

  .card-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin-bottom: 12px;
  }
  .card:nth-child(1) .card-icon { background: #fdf0e2; }
  .card:nth-child(2) .card-icon { background: #e2f0e8; }
  .card:nth-child(3) .card-icon { background: #ebe2f0; }
  .card:nth-child(4) .card-icon { background: #f0ebe2; }

  .card-title {
    font-size: .95rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .card-desc {
    font-size: .72rem;
    color: var(--text-light);
    line-height: 1.45;
  }

  /* 底部信息 */
  .footer {
    text-align: center;
    padding: 12px 20px calc(16px + var(--safe-bottom));
    font-size: .68rem;
    color: var(--text-light);
    opacity: .5;
  }

  /* 入场动画 */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:nth-child(1) { animation: fadeUp .4s .05s both; }
  .card:nth-child(2) { animation: fadeUp .4s .15s both; }
  .card:nth-child(3) { animation: fadeUp .4s .25s both; }
  .card:nth-child(4) { animation: fadeUp .4s .35s both; }
  .brand { animation: fadeUp .45s 0s both; }
</style>
</head>
<body>

<div class="brand">
  <div class="app-icon"><img src="app-icon.png" alt="校拟设定簿"></div>
  <h1>校拟设定簿</h1>
  <div class="subtitle">记录你的 OC 世界</div>
</div>

<div class="cards">
  <a href="/m" class="card">
    <div class="card-icon">👤</div>
    <div class="card-title">角色</div>
    <div class="card-desc">管理角色档案<br>按地区分类查看</div>
  </a>
  <a href="/m/worldview" class="card">
    <div class="card-icon">🌍</div>
    <div class="card-title">世界观</div>
    <div class="card-desc">构建世界设定<br>记录背景故事</div>
  </a>
  <a href="/m/relations" class="card">
    <div class="card-icon">🔗</div>
    <div class="card-title">关系网</div>
    <div class="card-desc">编织人物关系<br>可视化图谱</div>
  </a>
  <a href="/m/documents" class="card">
    <div class="card-icon">📄</div>
    <div class="card-title">文档</div>
    <div class="card-desc">管理参考文件<br>灵感永不丢失</div>
  </a>
</div>

<div class="footer">校拟设定簿 v1.0</div>

</body>
</html>
