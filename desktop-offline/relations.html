<script>
// ====== 主题切换 ======
function applyTheme(theme) {
  const html = document.documentElement;
  if (theme === 'dark') html.setAttribute('data-theme', 'dark');
  else html.removeAttribute('data-theme');
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
  if (label) label.textContent = theme === 'dark' ? '浅色' : '深色';
}
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  try { localStorage.setItem('oc-theme', next); } catch(e) {}
  applyTheme(next);
  if (typeof drawGraph === 'function' && allCharacters.length) { try { drawGraph(); } catch(e) {} }
}
// 读取当前主题的 CSS 变量值（用于 canvas 绘制）
function themeVar(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

const API_REL = '/api/relations';
const API_CHAR = '/api/characters';
let allRelations = [];
let allCharacters = [];
let deleteTargetId = null;
let selectedFromCharId = null;

// 类型筛选 & 导出
let activeType = '全部';
let exportMode = false;
let selectedIds = new Set();
let visibleRelations = [];

// 家族颜色配置
const FAMILY_COLORS = [
  '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6',
  '#1abc9c', '#e67e22', '#2980b9', '#27ae60', '#8e44ad',
  '#e91e63', '#00bcd4', '#ff5722', '#607d8b', '#cddc39',
  '#795548', '#673ab7', '#009688', '#ff9800', '#3f51b5',
];
let familyColorMap = {};  // family名 → 颜色
let familyEditMap = {};   // 家族编辑临时存储 charId → family名

// Graph state
let nodes = [];       // {id, name, gender, x, y, r}
let edges = [];       // {id, from, to, type, desc}
let nodeMap = {};
let dragNode = null;
let dragOffX = 0, dragOffY = 0;
// 注意：平移视图时是直接位移所有节点坐标（见 onMouseMove），节点坐标里
// 已经含了平移量。因此 offsetX/offsetY 【不再参与】布局计算
// （fitToView 的居中、gSimulateStep 的中心引力、computeLayout 的播种
//   一律用 cw/2、ch/2）。这两个变量仅在平移时累加、布局结束时归零，
// 用于调试观察，切勿再当作"布局中心偏移"使用。
let offsetX = 0, offsetY = 0;
let scale = 1;
// 本次会话内被拖动过的节点位置（id → {x, y}）。
// 只有内存态，**不写 localStorage**：刷新页面后一切归零、全部节点重新参与
// 自动布局。历史上这里做过持久化（graphPinnedPos），结果拖过的节点会一直被
// 钉在旧位置，攒多了整张图就塌成一团，且用户完全无从察觉 —— 这个坑已弃用。
const pinnedPos = new Map();
let canvas, ctx, cw, ch;

document.addEventListener('DOMContentLoaded', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  loadData().then(() => {
    // 全局搜索跳转定位：/relations?rel=ID → 滚动到该关系并高亮
    const gsRel = new URLSearchParams(location.search).get('rel');
    if (gsRel) {
      const el = document.getElementById('rel-' + gsRel);
      if (el) {
        el.scrollIntoView({ block: 'center' });
        el.classList.add('highlight');
        setTimeout(() => el.classList.remove('highlight'), 4000);
      }
    }
  });
});

async function loadData() {
  try {
    const [relRes, charRes] = await Promise.all([
      fetch(API_REL),
      fetch(API_CHAR)
    ]);
    allRelations = await relRes.json();
    allCharacters = await charRes.json();

    // 清理已不存在的选中 ID
    const currentIds = new Set(allRelations.map(r => r.id));
    for (const id of selectedIds) { if (!currentIds.has(id)) selectedIds.delete(id); }
    if (exportMode) updateExportButtons();

    buildNodeMap();
    buildEdges();
    buildTypeTabs();
    renderRelList();
    initCanvas();
    drawGraph();
    updateFamilyLegend();
  } catch(e) {
    console.error('加载失败:', e.message, e.stack);
    showToast('加载失败: ' + e.message, 'error');
  }
}

function buildNodeMap() {
  nodeMap = {};
  allCharacters.forEach(c => {
    nodeMap[c.id] = c;
  });
  buildFamilyColors();
}

function buildFamilyColors() {
  familyColorMap = {};
  let colorIdx = 0;
  allCharacters.forEach(c => {
    const fams = splitFamilies(c.family || '');
    fams.forEach(fam => {
      if (fam && !(fam in familyColorMap)) {
        familyColorMap[fam] = FAMILY_COLORS[colorIdx % FAMILY_COLORS.length];
        colorIdx++;
      }
    });
  });
}

function splitFamilies(famStr) {
  return (famStr || '').split(/[、,，]/).map(s => s.trim()).filter(Boolean);
}

function getFamilyColor(node) {
  const fams = splitFamilies(node.family || '');
  return fams.length > 0 ? familyColorMap[fams[0]] : null;
}

function getNodeFamilies(node) {
  return splitFamilies(node.family || '');
}

function updateFamilyLegend() {
  const legend = document.getElementById('graphLegend');
  // 重建家族图例
  const families = Object.keys(familyColorMap);
  let famHtml = '';
  families.forEach(fam => {
    const color = familyColorMap[fam];
    famHtml += `<div class="legend-item fam-legend"><span class="legend-dot" style="background:${color};border-color:${color};"></span> ${fam}</div>`;
  });
  legend.querySelectorAll('.fam-legend').forEach(el => el.remove());
  if (famHtml) legend.insertAdjacentHTML('beforeend', famHtml);
}

function buildEdges() {
  edges = allRelations.map(r => ({
    id: r.id,
    from: r.from_char_id,
    to: r.to_char_id,
    type: r.relation_type || '关联',
    desc: r.description || '',
  }));
}

// 画布高度自适应角色数：角色多时把画布撑高，让物理布局有足够空间舒展，
// 而不是把几十个节点硬塞进 480px 里挤成一团（这正是"网页版一团"的根源）。
// 页面本身可滚动，所以撑高画布不会挡住下面的关系列表。
// 目标：给每个节点约 110×110 的领地（桌面节点圆 56px + 间隙），
// 并让画布尽量接近正方形，物理布局的圆盘才能自然落进去。
function pickCanvasHeight(n) {
  const base = 480;
  const perNode = 132;                       // 每个节点占的边长（含间隙）
  const needSide = Math.sqrt(Math.max(1, n)) * perNode + 140;
  const maxH = Math.max(600, Math.min(2600, Math.round(window.innerHeight * 2.2)));
  return Math.round(Math.max(base, Math.min(maxH, needSide)));
}

function initCanvas() {
  canvas = document.getElementById('graphCanvas');
  const wrap = document.getElementById('canvasWrap');
  // 角色数已知，先定高度，再量尺寸
  wrap.style.height = pickCanvasHeight(allCharacters.length) + 'px';
  cw = wrap.clientWidth;
  ch = wrap.clientHeight;
  canvas.width = cw * window.devicePixelRatio;
  canvas.height = ch * window.devicePixelRatio;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  // 清理历史遗留的拖拽持久化记录。
  // 旧版本会把"拖动过的节点位置"写进 localStorage（graphPinnedPos），刷新后
  // 原样恢复 —— 结果拖过的节点被永久钉在旧位置，攒多了整张图就塌成一团
  // （实测见过 68/80 个节点被钉在仅 3 个 y 值上）。该机制已移除，这里顺手
  // 把残留数据删掉，省得占地方也省得日后误读。
  if (localStorage.getItem('graphPinnedPos') !== null) {
    localStorage.removeItem('graphPinnedPos');
    console.info('[布局] 已移除旧的节点固定记录（graphPinnedPos），拖拽不再持久化');
  }

  // 计算初始布局
  computeLayout();

  // Events
  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('wheel', onWheel, {passive: false});
  canvas.addEventListener('dblclick', onDblClick);

  window.addEventListener('resize', () => {
    const wrap = document.getElementById('canvasWrap');
    wrap.style.height = pickCanvasHeight(allCharacters.length) + 'px';
    cw = wrap.clientWidth; ch = wrap.clientHeight;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = cw * window.devicePixelRatio;
    canvas.height = ch * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    drawGraph();  // 只重绘，保持节点位置
  });
}

// =====================================================================
// 布局：全局力导向物理模拟（已与手机版 app.js 统一）
// ---------------------------------------------------------------------
// 旧版是"家族圈几何排布"：每个家族先跑一轮家族级力模拟定中心，成员再钉
// 到成员圈圆周上。家族一多、成员一杂，圆周就互相穿插，看着是一团乱麻。
// 现在直接移植手机版的全身物理模拟：斥力 + 边弹簧 + 家族弹簧 + 中心引力，
// 分帧迭代（每帧留时间预算，不阻塞界面），配 cooling 逐渐冷却。
// 参数按画布尺寸自适应：画布越大，斥力/弹簧平衡距离等比放大。
// =====================================================================

let layoutEpoch = 0;        // 每次重排自增，用于作废旧的分帧循环
let gLayoutHandle = null;   // requestAnimationFrame / setTimeout 句柄
const gCooling = { v: 1 };  // 当前冷却系数

// 画布尺寸自适应参数。
// 关键点：网页版画布尺寸多变（宽而矮/高而窄），节点半径也与手机版不同
// （桌面 nodeR=28，手机 16）。因此不能照抄手机的常数，而要：
//   1) 用 Fruchterman-Reingold 的理想边长 k = C·√(面积/节点数)，
//      让间距自动适配任意画布尺寸与节点数量；
//   2) 画布高度已按节点数自适应（见 pickCanvasHeight），
//      所以这里不必把图硬压进一个小方框，布局自然舒展即可。
function layoutParams() {
  const nodeR = 28;
  const n = Math.max(1, nodes.length);
  // ---- Fruchterman-Reingold 参数 ----
  // 1) 理想间距 k 由【实际可用面积】与节点数决定：k = C·√(A/n)。
  //    注意此前用的是"短边的一半"当半径，画布 1158×1321 时只按 1158 算，
  //    → 高度方向的余量被浪费，图只铺到 1077 高就被斥力顶住，反而更挤。
  //    改成用真实面积（宽×高）后，k 会随画布一起变大，节点铺得更开。
  //    下限 nodeR*3.5 ≈ 98：保证两圆心至少放得下两个圆 + 标签余量。
  // 2) 斥力加"作用半径上限"（dMax）：纯 FR 的 k²/d 对【所有】节点对生效，
  //    而引力只沿稀疏的关系边存在 → 图会无限膨胀（实测 80 点可涨到 2600px）。
  //    限制作用半径后，整体尺度就由 k 与中心引力共同锁定。
  const pad = 70;                                   // 画布四周留白
  const availW = Math.max(160, cw - pad * 2);
  const availH = Math.max(160, ch - pad * 2);
  // 填充系数 0.92：理想圆盘均匀铺满时 k=√(A/n)（A=πR²），
  // 家族聚簇会让局部更密，略留余量以免重叠。
  const kFit = Math.sqrt((availW * availH) / (Math.PI * n)) * 0.92;
  const k = Math.max(nodeR * 3.5, Math.min(360, kFit));
  const repulsion = k * k;             // 斥力分子：f = k²/d（d 超过 dMax 后按 0 计）
  return {
    k,
    repulsion,
    // 斥力作用半径：k 的 2.6~4 倍。节点越多作用半径越大，
    // 否则远处节点互不感知、密集图会缩成一团。
    dMax: k * Math.min(4.2, 2.6 + n / 90),
    spring: 0.45,     // 关系边引力系数：f = d²/k * spring
    cg: 0.03,         // 中心引力：配合 dMax 一起定住整体尺度
    // 家族引力理想长度取 1.35k：明显大于普通关系间距，让同族"聚团但不挤压"。
    // 之前取 1.15k + famSpring 0.55 → 12 人的大家族被硬拉进一个很小的圈，
    // 内部挤在一起，斥力解不开（实测重叠 37 处）。
    famK: k * 1.35,
    famSpring: 0.34,  // 家族引力系数（调低，减少同族内部挤压）
    targetR: 0,       // 不再需要硬边界
  };
}

// 一次物理步进。cooling ∈ (0,1]，越小越"冷静"（位移越少）
// 力模型采用 Fruchterman-Reingold：
//   斥力 f_r = k² / d           （所有节点对）
//   引力 f_a = d² / k * spring  （沿关系边 / 家族边，spring 为强度系数）
// 平衡时 f_r = f_a → d³ = k³ * spring，即相邻节点距离 ≈ k（spring≈1 时）。
// 由于每步位移被限幅在 temperature 以内，力的绝对量级不影响结果，只影响收敛速度。
function gSimulateStep(cooling) {
  const P = layoutParams();
  const k = P.k, repulsion = P.repulsion, spring = P.spring;
  const cg = P.cg, famK = P.famK, famSpring = P.famSpring, dMax = P.dMax || Infinity;
  // 中心引力参考点 = 画布中心（不含 offsetX/offsetY）：
  // 平移视图时节点坐标已整体位移，若这里再叠加 offset，力场中心会和
  // 实际图心错开，布局会朝一侧漂移。offset 只用于"用户手动平移"，
  // 不参与布局计算。
  const cx = cw / 2;
  const cy = ch / 2;

  // 初始化加速度
  for (const n of nodes) { n.ax = 0; n.ay = 0; }

  // 1. 两两斥力（O(n²)，角色规模不大可以接受）：f = k²/d，超出 dMax 不计
  //    额外加一个"碰撞排斥"：当两节点中心距 < 2*nodeR + 间隙时，
  //    施加很强的额外推力，从根上保证节点圆不重叠（类似 d3 的 forceCollide）。
  const dMax2 = dMax * dMax;
  const nodeR = 28;
  // 最小中心距：两个圆直径 56 + 额外 14px 呼吸缝 = 70。
  // 取 70（而非 56）是为了让"视觉上刚好挨着"的节点也留出一点缝隙，
  // 顺带把名字标签（画在圆下方）的横向拥挤也缓和掉。
  const minSep = nodeR * 2 + 14;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
      const d = Math.sqrt(d2);
      const ux = dx / d, uy = dy / d;
      let f = 0;
      if (d2 <= dMax2) f = repulsion / d;
      if (d < minSep) {
        // 碰撞力：距离越近越强，量级与 k²/d 同级但增长更快。
        // 系数 3.6 + 下限 6：近距离时力足够大，压过家族弹簧的挤压，
        // 保证"贴住"的节点对最终也能被推开（此前 2.4 时残留 7 处微重叠）。
        const overlap = (minSep - d) / minSep;
        f += repulsion / Math.max(6, d) * overlap * 3.6;
      }
      if (f === 0) continue;
      a.ax -= ux * f; a.ay -= uy * f;
      b.ax += ux * f; b.ay += uy * f;
    }
  }

  // 2. 边弹簧：关系边两端互相拉近：f = d²/k * spring
  const byId = window._nodeById;
  if (byId) {
    for (const e of edges) {
      const a = byId[e.from], b = byId[e.to];
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.1;
      const f = (d * d / k) * spring;
      const ux = dx / d, uy = dy / d;
      a.ax += ux * f; a.ay += uy * f;
      b.ax -= ux * f; b.ay -= uy * f;
    }
    // 3. 家族弹簧：同家族成员互相拉近（让同族成团），自然形成聚簇
    //    理想边长随家族规模放大：m 个成员若都要保持最小间距，簇半径需 ~ s·√m。
    //    若只用固定 famK，12 人的大家族会被硬压进和 2 人一样的圈里 →
    //    内部严重重叠（实测"中央家族"12 人贡献了 19 处重叠中的 11 处）。
    //    故取 famK_eff = famK · (1 + (m-2)/6)，m=2 时不变，m=12 时约 2.7 倍。
    const famMembers = window._famMemberIndex;
    if (famMembers) {
      for (const fam in famMembers) {
        const arr = famMembers[fam];
        if (!arr || arr.length < 2) continue;
        const famKeff = famK * (1 + (arr.length - 2) / 6);
        for (let i = 0; i < arr.length; i++) {
          for (let j = i + 1; j < arr.length; j++) {
            const a = byId[arr[i]], b = byId[arr[j]];
            if (!a || !b) continue;
            const dx = b.x - a.x, dy = b.y - a.y;
            const d = Math.sqrt(dx * dx + dy * dy) || 0.1;
            const f = (d * d / famKeff) * famSpring;
            const ux = dx / d, uy = dy / d;
            a.ax += ux * f; a.ay += uy * f;
            b.ax -= ux * f; b.ay -= uy * f;
          }
        }
      }
    }
  }

  // 4. 中心引力 + 温度限幅 + 积分
  //    中心引力把整图往画布中心收，配合斥力的作用半径上限一起锁定整体尺度。
  const temperature = Math.max(0.5, cooling * cooling * 30);  // 每步最大位移
  for (const n of nodes) {
    if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
    n.ax += (cx - n.x) * cg;
    n.ay += (cy - n.y) * cg;
    // 位移长度限幅到 temperature
    let dx2 = n.ax, dy2 = n.ay;
    const dl = Math.sqrt(dx2 * dx2 + dy2 * dy2);
    if (dl > temperature) { dx2 = dx2 / dl * temperature; dy2 = dy2 / dl * temperature; }
    n.x += dx2;
    n.y += dy2;
  }
}

// 收敛后把整张图等比缩放+平移，使其恰好放进可视区（留边距）。
// 只缩放视图、不改变拓扑，也不丢用户手动拖过的相对位置——
// 所有节点按同一变换处理，拖动固定下来的相对关系自然保留。
// 注意：这里【不做硬夹】，个别出界交给"加高画布"或"局部回拉"处理，
// 因为整体硬夹会把已收敛的间距压小、重新制造重叠（实测 5 处 → 12 处）。
function fitToView() {
  if (!nodes.length) return;
  const pad = 46;   // 四周留白（原 60 偏大，会让本来就贴边的图收得更小）
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(n => {
    minX = Math.min(minX, n.x - n.r - 18);
    maxX = Math.max(maxX, n.x + n.r + 18);
    minY = Math.min(minY, n.y - n.r - 18);
    maxY = Math.max(maxY, n.y + n.r + 34);  // 下方留名字+家族标签的空间
  });
  const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
  const availW = Math.max(120, cw - pad * 2);
  const availH = Math.max(120, ch - pad * 2);
  let k = Math.min(availW / w, availH / h);
  // 温和收放：默认下限 0.90（收缩超过 10% 会把已收敛的间距压小、
  // 重新制造重叠，实测 0.66 → 重叠 11 处）。
  // 例外：若【宽度】明显超框（横向出界无法靠"加高画布"解决），
  // 则允许再收一点（下限放到 0.78），宁可轻微收紧也不要让节点
  // 被 clampInsideView 压成一条竖线（实测会出现间距 10px 的重叠）。
  const widthOver = w / availW;        // >1 表示横向超框
  let floor = 0.90;
  if (widthOver > 1.02) floor = 0.78;
  k = Math.max(floor, Math.min(1.05, k));
  // 目标：图心对齐画布中心。
  // 注意：这里【不能】再加 offsetX/offsetY —— 平移视图时是所有节点坐标
  // 一起被改掉的（见 onMouseMove），也就是说坐标里已经含了平移量。
  // 再把 offset 加进目标中心等于平移被计入两次，整张图会被推离画布
  // （Edge 干净打开时尤其明显：节点跑到 x 为负、只露一角）。
  const gcx = (minX + maxX) / 2, gcy = (minY + maxY) / 2;
  const tx = cw / 2, ty = ch / 2;
  nodes.forEach(n => {
    n.x = tx + (n.x - gcx) * k;
    n.y = ty + (n.y - gcy) * k;
  });
  // 图已重新居中，平移偏移随之失效，归零以保持语义一致
  offsetX = 0; offsetY = 0;
  // 会话内的固定位置（拖动过的节点）同步按同一变换更新，否则整体缩放后
  // 这些节点会跳回旧尺度；只改内存，不落盘。
  pinnedPos.forEach((v, id) => {
    pinnedPos.set(id, { x: tx + (v.x - gcx) * k, y: ty + (v.y - gcy) * k });
  });
}

// 收尾修正：把仍出界的节点沿最短方向拉回画布内侧。
// 关键：不能简单地把所有越界节点钉在同一条边上（会把它们压成一列，
// 出现间距仅 10px 的重叠）。这里做的是"迭代式分离"：
//   1) 先按溢出量把出界节点拉回边界内；
//   2) 再检查是否有节点对因此挤得过近，把其中出界过的那个沿边方向
//      推开（只在边界内侧滑动，不会再出界）。
function clampInsideView() {
  const marginX = 30, marginTop = 30, marginBot = 40;
  const minSep = 70;                     // 与物理步进中的最小中心距一致
  // 记录哪些节点原本出界（只需修正这些）
  const fixedList = [];
  for (const n of nodes) {
    let touched = false;
    if (n.x < marginX) { n.x = marginX; touched = true; }
    else if (n.x > cw - marginX) { n.x = cw - marginX; touched = true; }
    if (n.y < marginTop) { n.y = marginTop; touched = true; }
    else if (n.y > ch - marginBot) { n.y = ch - marginBot; touched = true; }
    if (touched) fixedList.push(n);
  }
  // 分离：对每个被修正过的节点，若与其它节点距离 < minSep，沿连线推开
  for (let iter = 0; iter < 30; iter++) {
    let moved = false;
    for (const a of fixedList) {
      for (const b of nodes) {
        if (a === b) continue;
        let dx = a.x - b.x, dy = a.y - b.y;
        let d = Math.sqrt(dx * dx + dy * dy);
        if (d >= minSep) continue;
        if (d < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = 1; }
        const push = (minSep - d) + 0.5;
        const ux = dx / d, uy = dy / d;
        // 只推动 a（原本出界的节点），并确保它仍在边界内
        a.x = Math.max(marginX, Math.min(cw - marginX, a.x + ux * push));
        a.y = Math.max(marginTop, Math.min(ch - marginBot, a.y + uy * push));
        moved = true;
      }
    }
    if (!moved) break;
  }
  // 同步会话内的固定位置，避免下次重排跳回出界处（只改内存，不落盘）
  pinnedPos.forEach((v, id) => {
    pinnedPos.set(id, {
      x: Math.max(marginX, Math.min(cw - marginX, v.x)),
      y: Math.max(marginTop, Math.min(ch - marginBot, v.y)),
    });
  });
}

// 分帧迭代：每帧最多约 8ms 计算时间，避免卡界面。
// 用 rAF + setTimeout 双保险：标签页/窗口不可见时浏览器会暂停 rAF，
// 只挂 rAF 会让布局"卡死"在半途（此前就是这个坑）。两者谁先触发谁接力，
// 另一个立即撤销，保证任何可见性状态下都能收敛。
let gRafHandle = null, gToHandle = null;

function gCancelFrame() {
  if (gRafHandle !== null) { cancelAnimationFrame(gRafHandle); gRafHandle = null; }
  if (gToHandle !== null) { clearTimeout(gToHandle); gToHandle = null; }
}

function gNextFrame(epoch, stepsLeft) {
  gCancelFrame();
  gLayoutHandle = 1;   // 非 null，表示"循环进行中"
  let started = false;
  const fire = () => {
    if (started) return;
    started = true;
    gCancelFrame();
    gLayoutLoop(epoch, stepsLeft);
  };
  gRafHandle = requestAnimationFrame(fire);
  gToHandle = setTimeout(fire, 32);
}

function gLayoutLoop(epoch, stepsLeft) {
  if (epoch !== layoutEpoch) return;
  const t0 = performance.now();
  while (stepsLeft > 0 && performance.now() - t0 < 9) {
    // 降温曲线：前半程保持较高"温度"（大步调整、快速消除重叠），
    // 后半程再逐渐收紧（精细微调、稳定下来）。
    // 之前线性降到 0.04 导致后半程几乎不动，残留重叠解不开；
    // 这里改用 sqrt 型缓降 + 0.12 下限，让全程都有调整能力。
    const progress = 1 - stepsLeft / gTotalSteps;
    gCooling.v = Math.max(0.12, 1 - Math.sqrt(progress) * 0.93);
    gSimulateStep(gCooling.v);
    stepsLeft--;
    if (stepsLeft <= 0) break;
  }
  drawGraph();
  if (stepsLeft > 0) {
    gNextFrame(epoch, stepsLeft);
  } else {
    gLayoutHandle = null;
    gCancelFrame();
    fitToView();     // 收敛后等比缩放，让整张图恰好放进可视区
    // 若纵向仍有节点出界（说明画布高度不够），加高画布并重排一次。
    // 只重排一次（gGrowOnce 防抖），避免来回振荡。
    // 注意：横向出界无法靠"加高"解决（画布宽度受页面限制），
    //      横向的个别越界交给 clampInsideView 局部回拉。
    if (!gGrowOnce && growCanvasIfNeeded()) {
      gGrowOnce = true;
      const e2 = ++layoutEpoch;
      gLayoutHandle = null;
      for (const n of nodes) { n.vx = 0; n.vy = 0; }
      gNextFrame(e2, Math.round(gTotalSteps * 0.5));
      return;
    }
    gGrowOnce = false;
    clampInsideView();   // 兜底：把极个别越界节点拉回画布内
    drawGraph();
    loadAvatars();
  }
}

let gGrowOnce = false;

// 检测节点是否【纵向】出界；若有，加高画布（只加高，不改宽），
// 并把画布实际尺寸同步给 canvas 元素。返回 true 表示"已加高、需要重排"。
// 横向出界不在这里处理（加高无济于事），交给 clampInsideView。
function growCanvasIfNeeded() {
  const wrap = document.getElementById('canvasWrap');
  if (!wrap || !canvas) return false;
  let maxY = -Infinity, minY = Infinity;
  for (const n of nodes) {
    maxY = Math.max(maxY, n.y + n.r + 40);
    minY = Math.min(minY, n.y - n.r - 18);
  }
  const overH = maxY > ch - 6 || minY < 6;
  if (!overH) return false;
  // 需要的总高度：容下全部节点 + 上下边距
  const needH = Math.ceil((maxY - minY) + 90);
  const newH = Math.min(Math.round(window.innerHeight * 3.4), needH);
  if (newH <= ch + 8) return false;
  wrap.style.height = newH + 'px';
  cw = wrap.clientWidth;
  ch = wrap.clientHeight;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = cw * window.devicePixelRatio;
  canvas.height = ch * window.devicePixelRatio;
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  return true;
}

let gTotalSteps = 1;

function startGlayout() {
  if (!nodes.length) return;
  // 取消上一次未跑完的循环
  layoutEpoch++;
  gCancelFrame();
  gLayoutHandle = null;
  // 步数随节点数增长（O(n²) 的斥力需要足够轮次才能把重叠完全解开；
  // 实测 80 个节点需要 ~2500 步才能从 59 处重叠收敛到个位数）。
  gTotalSteps = Math.min(3000, Math.max(700, nodes.length * 32));
  gCooling.v = 1;
  const epoch = layoutEpoch;
  // 清掉旧速度，避免残留
  for (const n of nodes) { n.vx = 0; n.vy = 0; n.ax = 0; n.ay = 0; }
  gNextFrame(epoch, gTotalSteps);
}

function computeLayout() {
  nodes = [];
  const chars = allCharacters;
  if (chars.length === 0) return;

  // 播种中心 = 画布中心。布局每次都会重新居中（fitToView），
  // 所以这里不引入 offsetX/offsetY，否则播种位置会整体偏移。
  const cx = cw / 2;
  const cy = ch / 2;
  const nodeR = 28;

  // ====== 1. 家族归属（一个角色可属多个家族） ======
  const famMemberSet = {};      // 家族名 → Set(charId)
  const famMemberIndex = {};    // 家族名 → [charId]  供物理模拟用
  const charFams = {};          // charId → [家族名]

  chars.forEach(c => {
    const fams = splitFamilies(c.family || '');
    charFams[c.id] = fams;
    fams.forEach(f => {
      if (!famMemberSet[f]) { famMemberSet[f] = new Set(); famMemberIndex[f] = []; }
      if (!famMemberSet[f].has(c.id)) { famMemberSet[f].add(c.id); famMemberIndex[f].push(c.id); }
    });
  });

  // ====== 2. 初始播种：家族中心摆一圈，成员聚在家族中心附近 ======
  // 关键：播种半径必须【能放进画布】。之前 baseR = min(cw,ch)*0.28*√(fams/2)，
  // 19 个家族时会得到 0.28*√9.5 ≈ 0.86 倍画布短边 → 种子本身就已溢出，
  // 物理再膨胀一点，fitToView 再怎么收也拉不回来（实测 11 个节点在画布外）。
  // 改为按"家族数"在受限维度内吃水：家族越多环越大，但最大不超过短边的 45%。
  const allFams = Object.keys(famMemberIndex);
  const halfShort = Math.min(cw, ch) * 0.5;
  const baseR = allFams.length > 1
    ? Math.min(halfShort * 0.45, halfShort * 0.30 * Math.sqrt(allFams.length))
    : 0;
  const famCenter = {};
  allFams.forEach((f, i) => {
    const a = allFams.length > 1
      ? (2 * Math.PI * i) / allFams.length - Math.PI / 2
      : 0;
    famCenter[f] = {
      x: cx + (allFams.length > 1 ? baseR * Math.cos(a) : 0),
      y: cy + (allFams.length > 1 ? baseR * Math.sin(a) : 0),
    };
  });

  const spread = Math.min(cw, ch) * 0.18;

  chars.forEach(c => {
    const fams = charFams[c.id] || [];
    let bx = cx, by = cy;
    if (fams.length > 0) {
      let sx = 0, sy = 0, cnt = 0;
      fams.forEach(f => { const fc = famCenter[f]; if (fc) { sx += fc.x; sy += fc.y; cnt++; } });
      if (cnt > 0) { bx = sx / cnt; by = sy / cnt; }
    }
    // 本次会话内拖动过的节点：固定在该位置（fixed=true），物理模拟不再移动它。
    // 刷新后这个表是空的，所有节点都会重新参与布局。
    const keep = pinnedPos.get(c.id);
    nodes.push({
      id: c.id, name: c.name, family: c.family || '',
      gender: c.gender,
      face_crop: c.face_crop || '',
      // 头像取自 face_crop.img 指定的那张图（不是写死的首图）：
      // 取脸时任意一张照片都能被圈选，所以节点要显示"被选中的那张"。
      avatarRef: (function () {
        const imgs = normalizeImages(c);
        const fc = FaceCrop.parse(c.face_crop);
        const i = (fc && fc.img >= 0 && fc.img < imgs.length) ? fc.img : 0;
        return imgs[i] || '';
      })(),
      x: keep ? keep.x : bx + (Math.random() - 0.5) * spread,
      y: keep ? keep.y : by + (Math.random() - 0.5) * spread,
      vx: 0, vy: 0, ax: 0, ay: 0,
      fixed: !!keep,
      r: nodeR,
    });
  });

  // 查询索引，供物理模拟用
  window._nodeById = {};
  nodes.forEach(n => { window._nodeById[n.id] = n; });
  window._famMemberSet = famMemberSet;
  window._famMemberIndex = famMemberIndex;
  window._famCenter = famCenter;

  startGlayout();
  loadAvatars();
}

// ---- 节点头像：把 face_crop.img 指定的那张图按 face_crop 裁成圆形画布并缓存 ----
const avatarCache = new Map();   // id → HTMLImageElement（已裁好的圆形图）或 null
const avatarSig = new Map();     // id → ref|crop 签名（变了才重裁）
function avatarKey(n) {
  if (!n || !n.face_crop || !n.avatarRef) return '';
  return n.avatarRef + '|' + n.face_crop;
}
function loadAvatars() {
  if (!window.FaceCrop) return;
  nodes.forEach(n => {
    const key = avatarKey(n);
    if (!key) { avatarCache.delete(n.id); avatarSig.delete(n.id); return; }
    if (avatarSig.get(n.id) === key) return;
    avatarSig.set(n.id, key);
    const crop = FaceCrop.parse(n.face_crop);
    // 桌面端图片引用可能是相对路径（/api/images/…）、data URL 或 http(s) 绝对地址。
    // 相对路径在同一源下可直接被 <img> 加载，必须放行。
    const ref = String(n.avatarRef || '').trim();
    const src = /^(?:data:image\/|https?:\/\/|\/|\.\/|[^:/?#]+\/)/i.test(ref) ? ref : '';
    if (!crop || !src) { avatarCache.set(n.id, null); return; }
    const im = new Image();
    im.onload = () => {
      FaceCrop.cropToCanvas(im, crop, 128).then(cv => {
        // 直接存圆形画布（不走 toDataURL，避免任何 canvas 污染风险）
        avatarCache.set(n.id, cv || null);
        drawGraph();
      });
    };
    im.onerror = () => { avatarCache.set(n.id, null); };
    im.src = src;
  });
}

// 归一化 images 字段（与 index.html 同规则）
function normalizeImages(c) {
  let imgs = c.images;
  if (typeof imgs === 'string') { try { imgs = JSON.parse(imgs); } catch (e) { imgs = []; } }
  if (!Array.isArray(imgs)) imgs = [];
  if (imgs.length === 0 && c.image_url) imgs = [c.image_url];
  return imgs;
}



// ====== 凸包算法（Monotone Chain） ======
function convexHull(points) {
  if (points.length <= 2) return points;
  const sorted = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const lower = [];
  for (const p of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = sorted.length - 1; i >= 0; i--) {
    const p = sorted[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
function cross(o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); }

function drawFamilyClusters() {
  // 每个节点贡献到【所有】所属家族的包围圈（非仅第一个）
  const famPoints = {};   // 家族名 → [{x,y}] 成员圆心
  const famNodeIds = {};  // 家族名 → Set(nodeId) 去重

  nodes.forEach(n => {
    const fams = getNodeFamilies(n);
    fams.forEach(fam => {
      if (!famPoints[fam]) { famPoints[fam] = []; famNodeIds[fam] = new Set(); }
      if (famNodeIds[fam].has(n.id)) return;
      famNodeIds[fam].add(n.id);
      famPoints[fam].push({ x: n.x, y: n.y });
    });
  });

  const pad = 12;  // 凸包外扩距离

  Object.entries(famPoints).forEach(([fam, pts]) => {
    const totalCount = window._famMemberSet?.[fam]?.size ?? 0;
    if (pts.length < 2 && totalCount < 2) return;

    const color = familyColorMap[fam] || '#ccc';
    const nodeR = 28;

    if (pts.length === 1) {
      // 单节点：画小圆
      const r = nodeR + pad;
      ctx.beginPath();
      ctx.arc(pts[0].x, pts[0].y, r, 0, Math.PI * 2);
      ctx.fillStyle = color + '0A';
      ctx.fill();
      ctx.strokeStyle = color + '44';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color;
      ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(fam, pts[0].x, pts[0].y - r - 6);
      return;
    }

    // 为每个节点生成环绕点（节点圆上的采样点 + 外扩）
    const periPts = [];
    const samples = 8;
    pts.forEach(p => {
      for (let i = 0; i < samples; i++) {
        const a = (2 * Math.PI * i) / samples;
        periPts.push({
          x: p.x + (nodeR + pad) * Math.cos(a),
          y: p.y + (nodeR + pad) * Math.sin(a)
        });
      }
    });

    const hull = convexHull(periPts);
    if (hull.length < 3) return;

    // 画填充
    ctx.beginPath();
    ctx.moveTo(hull[0].x, hull[0].y);
    for (let i = 1; i < hull.length; i++) ctx.lineTo(hull[i].x, hull[i].y);
    ctx.closePath();
    ctx.fillStyle = color + '08';
    ctx.fill();

    // 画边框
    ctx.beginPath();
    ctx.moveTo(hull[0].x, hull[0].y);
    for (let i = 1; i < hull.length; i++) ctx.lineTo(hull[i].x, hull[i].y);
    ctx.closePath();
    ctx.strokeStyle = color + '55';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 标签：放在凸包几何中心偏上
    let cx = 0, cy = 0;
    hull.forEach(p => { cx += p.x; cy += p.y; });
    cx /= hull.length; cy /= hull.length;
    // 找凸包最上方的点
    let topY = Infinity;
    hull.forEach(p => { topY = Math.min(topY, p.y); });
    ctx.fillStyle = color;
    ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(fam, cx, topY - 6);
  });
}

// CP / 单箭头 / 继承记忆 / 参与组建 / 师生 / 朋友 / 冤家 / 亲属 边线渲染
function drawEdge(fromX, fromY, toX, toY, type, isBidirectional, highlight = false) {
  const dx = toX - fromX, dy = toY - fromY;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const ux = dx / len, uy = dy / len;
  const nodeR = 28;
  const arrowSize = 8;

  // 从节点边缘起止
  const sx = fromX + ux * nodeR;
  const sy = fromY + uy * nodeR;
  const ex = toX - ux * nodeR;
  const ey = toY - uy * nodeR;

  let color;
  if (type === 'CP') color = '#c44b7a';
  else if (type === '继承记忆') color = '#2e8b8a';
  else if (type === '参与组建') color = '#d4842a';
  else if (type === '师生') color = '#4a7db0';
  else if (type === '朋友') color = '#2ecc71';
  else if (type === '冤家') color = '#e67e22';
  else if (type === '亲属') color = '#2ecc71';
  else color = '#6b4c8a';
  const alpha = highlight ? 'b3' : '55';
  const isDashed = type === '继承记忆';

  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.strokeStyle = color + alpha;
  ctx.lineWidth = highlight ? 3 : 2;
  if (isDashed) ctx.setLineDash([8, 5]);
  ctx.stroke();
  ctx.setLineDash([]);

  // 箭头函数
  function drawTip(x, y) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - ux * arrowSize - uy * arrowSize * 0.6, y - uy * arrowSize + ux * arrowSize * 0.6);
    ctx.lineTo(x - ux * arrowSize + uy * arrowSize * 0.6, y - uy * arrowSize - ux * arrowSize * 0.6);
    ctx.closePath();
    ctx.fillStyle = color + alpha;
    ctx.fill();
  }

  drawTip(ex, ey);  // 目标端箭头
  if (isBidirectional) {
    // 双向关系：source端也画箭头，指向源节点（从target方向来）
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + ux * arrowSize - uy * arrowSize * 0.6, sy + uy * arrowSize + ux * arrowSize * 0.6);
    ctx.lineTo(sx + ux * arrowSize + uy * arrowSize * 0.6, sy + uy * arrowSize - ux * arrowSize * 0.6);
    ctx.closePath();
    ctx.fillStyle = color + alpha;
    ctx.fill();
  }
}

// 计算每条边标签的垂直偏移索引，避免同一对节点间多条边的标签重叠
function computeLabelOffsets(edgeArr) {
  const key = (f, t) => f < t ? f + '-' + t : t + '-' + f;
  const groups = {};
  edgeArr.forEach((e, i) => {
    const k = key(e.from, e.to);
    if (!groups[k]) groups[k] = [];
    groups[k].push(i);
  });
  const offsets = new Array(edgeArr.length).fill(0);
  Object.values(groups).forEach(indices => {
    const n = indices.length;
    if (n <= 1) return;
    // 2条 → [-1, +1]；3条 → [-2, 0, +2]；以此类推（保证间隔足够）
    indices.forEach((idx, k) => { offsets[idx] = (k - (n - 1) / 2) * 2; });
  });
  return offsets;
}

function drawGraph() {
  ctx.clearRect(0, 0, cw, ch);

  // 背景网格
  ctx.strokeStyle = themeVar('--canvas-grid', '#e8e0d5');
  ctx.lineWidth = 0.5;
  const gs = 40;
  for (let x = gs; x < cw; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
  }
  for (let y = gs; y < ch; y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
  }

  // 画家族聚类圈
  drawFamilyClusters();

  // 画边
  const labelOffsets = computeLabelOffsets(edges);
  edges.forEach((edge, i) => {
    const from = nodes.find(n => n.id === edge.from);
    const to = nodes.find(n => n.id === edge.to);
    if (!from || !to) return;

    const isBidirectional = ['CP', '参与组建', '朋友', '冤家', '亲属'].includes(edge.type);
    drawEdge(from.x, from.y, to.x, to.y, edge.type, isBidirectional);

    // 标签（沿垂直方向偏移，避免同一对节点间多条边标签重叠）
    const mx = (from.x + to.x) / 2;
    const my = (from.y + to.y) / 2;
    const dx = to.x - from.x, dy = to.y - from.y;
    const elen = Math.sqrt(dx * dx + dy * dy) || 1;
    const px = -dy / elen, py = dx / elen;
    const off = (labelOffsets[i] || 0) * 15;
    const lx = mx + px * off, ly = my + py * off;
    const label = edge.type;
    let labelColor;
    if (edge.type === 'CP') labelColor = '#c44b7a';
    else if (edge.type === '继承记忆') labelColor = '#2e8b8a';
    else if (edge.type === '参与组建') labelColor = '#d4842a';
    else if (edge.type === '师生') labelColor = '#4a7db0';
    else if (edge.type === '朋友') labelColor = '#2ecc71';
    else if (edge.type === '冤家') labelColor = '#e67e22';
    else if (edge.type === '亲属') labelColor = '#2ecc71';
    else labelColor = '#6b4c8a';
    ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(label).width + 8;
    ctx.fillStyle = themeVar('--canvas-label-bg', '#fff');
    ctx.fillRect(lx - tw/2, ly - 9, tw, 18);
    ctx.strokeStyle = labelColor + '55';
    ctx.lineWidth = 1;
    ctx.strokeRect(lx - tw/2, ly - 9, tw, 18);
    ctx.fillStyle = labelColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, lx, ly);
  });

  // 节点头尺寸排序（小的先画）
  const sortedNodes = [...nodes];

  // 画节点
  sortedNodes.forEach(node => {
    // 光晕
    const grad = ctx.createRadialGradient(node.x, node.y, node.r * 0.6, node.x, node.y, node.r + 6);
    if (node.gender === '男') {
      grad.addColorStop(0, 'rgba(107,76,138,0.4)');
      grad.addColorStop(1, 'rgba(107,76,138,0)');
      ctx.fillStyle = '#6b4c8a';
    } else if (node.gender === '女') {
      grad.addColorStop(0, 'rgba(196,75,122,0.4)');
      grad.addColorStop(1, 'rgba(196,75,122,0)');
      ctx.fillStyle = '#c44b7a';
    } else {
      grad.addColorStop(0, 'rgba(75,138,107,0.4)');
      grad.addColorStop(1, 'rgba(75,138,107,0)');
      ctx.fillStyle = '#4b8a6b';
    }
    ctx.beginPath();
    ctx.arc(node.x, node.y, node.r + 6, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // 主体圆
    const bodyGrad = ctx.createLinearGradient(node.x - node.r, node.y - node.r, node.x + node.r, node.y + node.r);
    if (node.gender === '男') {
      bodyGrad.addColorStop(0, '#8b6fc4');
      bodyGrad.addColorStop(1, '#6b4c8a');
    } else if (node.gender === '女') {
      bodyGrad.addColorStop(0, '#e07ba4');
      bodyGrad.addColorStop(1, '#c44b7a');
    } else {
      bodyGrad.addColorStop(0, '#6baf8a');
      bodyGrad.addColorStop(1, '#4b8a6b');
    }
    ctx.beginPath();
    ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    // 有头像时把裁好的圆形头像贴进节点圆内（保留描边与家族色环）
    const av = avatarCache.get(node.id);
    if (av) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(av, node.x - node.r, node.y - node.r, node.r * 2, node.r * 2);
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 家族色环
    const famColor = getFamilyColor(node);
    if (famColor) {
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.r + 3, 0, Math.PI * 2);
      ctx.strokeStyle = famColor;
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // 名字位置：有头像 → 画在圆外下方（否则会和头像糊在一起）；
    //          无头像 → 恢复"原来那样"：白字画在圆内（bold 13px / y-2 / 白）。
    if (av) {
      const shortName = node.name.length > 5 ? node.name.substring(0, 4) + '…' : node.name;
      ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = themeVar('--text', '#3d2b1f');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(shortName, node.x, node.y + node.r + 5);
    } else {
      const shortName = node.name.length > 4 ? node.name.substring(0, 4) + '…' : node.name;
      ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(shortName, node.x, node.y - 2);
    }

    // 家族标签（显示所有）：有头像时叠在名字下方（圆外）；无头像时留在圆内名字下方。
    const nodeFams = getNodeFamilies(node);
    if (nodeFams.length > 0) {
      ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
      const displayFams = nodeFams.map(f => f.length > 4 ? f.substring(0, 4) + '…' : f).join('·');
      const famLabel = displayFams.length > 12 ? displayFams.substring(0, 12) + '…' : displayFams;
      ctx.textAlign = 'center';
      if (av) {
        ctx.fillStyle = famColor || themeVar('--text-light', 'rgba(120,100,80,0.75)');
        ctx.textBaseline = 'top';
        ctx.fillText(famLabel, node.x, node.y + node.r + 21);
      } else {
        ctx.fillStyle = famColor || 'rgba(255,255,255,0.7)';
        ctx.textBaseline = 'middle';
        ctx.fillText(famLabel, node.x, node.y + 14);
      }
    }
  });
}

function findNodeAt(mx, my) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = mx - n.x, dy = my - n.y;
    if (dx * dx + dy * dy <= n.r * n.r) return n;
  }
  return null;
}

function onMouseDown(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const node = findNodeAt(mx, my);
  if (node) {
    if (e.ctrlKey || e.metaKey) {
      // Ctrl+Click: add relation from this node
      selectedFromCharId = node.id;
      openCreateModal();
      return;
    }
    dragNode = node;
    dragOffX = mx - node.x;
    dragOffY = my - node.y;
    // 拖动期间固定该节点（物理模拟不再移动它），松手后由 onMouseUp 写入
    // pinnedPos，作为"本次会话内保持"的位置；刷新即失效。
    node.fixed = true;
    node.vx = 0; node.vy = 0;
    canvas.style.cursor = 'grabbing';
  } else {
    dragNode = null;
    // pan
    dragOffX = mx;
    dragOffY = my;
    canvas.style.cursor = 'grab';
  }
}

function onMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (dragNode) {
    dragNode.x = mx - dragOffX;
    dragNode.y = my - dragOffY;
    drawGraph();
    canvas.style.cursor = 'grabbing';
  } else if (dragNode === null && e.buttons > 0) {
    // 平移：直接偏移所有节点位置，不重新计算布局
    const pdx = mx - dragOffX;
    const pdy = my - dragOffY;
    nodes.forEach(n => { n.x += pdx; n.y += pdy; });
    offsetX += pdx;
    offsetY += pdy;
    dragOffX = mx;
    dragOffY = my;
    drawGraph();
    canvas.style.cursor = 'grabbing';
  } else {
    const node = findNodeAt(mx, my);
    canvas.style.cursor = node ? 'pointer' : 'default';
  }
}

function onMouseUp(e) {
  if (dragNode) {
    // 记住本次拖动后的位置：仅存内存，本次会话内保持该节点不动；
    // 刷新页面后 pinnedPos 为空，节点重新参与自动布局。
    pinnedPos.set(dragNode.id, { x: dragNode.x, y: dragNode.y });
    canvas.style.cursor = 'default';
    dragNode = null;
  } else if (dragNode === null) {
    dragNode = undefined; // reset
    canvas.style.cursor = 'default';
  }
}

function onWheel(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.max(0.3, Math.min(3, scale * delta));
  // 直接缩放节点坐标，不重新计算布局
  nodes.forEach(n => {
    n.x = mx + (n.x - mx) * delta;
    n.y = my + (n.y - my) * delta;
  });
  drawGraph();
}

// 双击节点 = 查看角色信息（恒定行为）。
// 注意：不要在这里做别的分叉 —— 曾经把"解除位置固定"绑在双击上，导致拖动过的
// 节点再也无法双击查看，而那恰恰是最需要查看的节点。一个手势只做一件事。
function onDblClick(e) {
  const rect = canvas.getBoundingClientRect();
  const node = findNodeAt(e.clientX - rect.left, e.clientY - rect.top);
  if (!node) return;
  showCharInfo(node.id);
}

// --- 角色信息 ---
let infoCharId = null;

function infoRow(label, value) {
  if (!value) return '';
  return `<tr><td class="info-label">${label}</td><td>${esc(value)}</td></tr>`;
}

async function showCharInfo(charId) {
  infoCharId = charId;
  try {
    const res = await fetch(`${API_CHAR}/${charId}`);
    const c = await res.json();
    document.getElementById('infoName').textContent = c.name;
    let body = '<table style="width:100%;border-collapse:collapse;">';
    body += infoRow('代表高校', c.university);
    body += infoRow('地区', c.region);
    body += infoRow('诞生地', c.birthplace);
    body += infoRow('性别', c.gender);
    body += infoRow('身高', c.height);
    body += infoRow('生日', c.birthday);
    body += infoRow('诞生时间', c.birth_time);
    body += infoRow('身份存在时间', c.identity_period);
    body += infoRow('存在状态', c.status);
    body += infoRow('取名依据', c.naming_rationale);
    body += infoRow('外貌', c.appearance);
    if (c.family) {
      const fams = splitFamilies(c.family);
      const famBadges = fams.map(f => {
        const fc = familyColorMap[f] || '#8b6914';
        return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px;"><span class="legend-dot" style="display:inline-block;background:${fc};border-color:${fc};width:10px;height:10px;border-radius:50%;"></span>${esc(f)}</span>`;
      }).join('');
      body += `<tr><td class="info-label">家族</td><td>${famBadges}</td></tr>`;
    }
    if (c.setting) body += `<tr><td class="info-label">设定</td><td style="white-space:pre-wrap;line-height:1.6;">${esc(c.setting)}</td></tr>`;
    body += '</table>';
    document.getElementById('infoBody').innerHTML = body || '<p style="color:var(--text-light);text-align:center;">暂无详细信息</p>';

    document.getElementById('infoOverlay').classList.add('active');
  } catch(e) {
    showToast('获取角色信息失败', 'error');
  }
}

function startRelationFromInfo() {
  if (infoCharId) {
    selectedFromCharId = infoCharId;
    closeInfoModal();
    openCreateModal();
  }
}

function closeInfoModal() {
  document.getElementById('infoOverlay').classList.remove('active');
  infoCharId = null;
}

document.getElementById('infoOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeInfoModal();
});

// --- 关系列表 ---
let draggedRelIndex = null;

function renderRelList() {
  const list = document.getElementById('relList');
  const empty = document.getElementById('emptyState');

  if (allRelations.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    empty.querySelector('p').textContent = '还没有建立角色关系，点击上方按钮添加吧';
    return;
  }

  // 搜索过滤
  const q = (document.getElementById('relSearchInput')?.value || '').trim().toLowerCase();
  let filtered = allRelations;

  // 类型筛选
  if (activeType !== '全部') {
    filtered = filtered.filter(r => r.relation_type === activeType);
  }

  if (q) {
    filtered = filtered.filter(r => {
      const fromName = (r.from_name || '').toLowerCase();
      const toName = (r.to_name || '').toLowerCase();
      const type = (r.relation_type || '').toLowerCase();
      const desc = (r.description || '').toLowerCase();
      return fromName.includes(q) || toName.includes(q) ||
             type.includes(q) || desc.includes(q);
    });
  }

  visibleRelations = filtered;

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    empty.querySelector('p').textContent = (q || activeType !== '全部') ? '没有匹配的关系' : '还没有建立角色关系，点击上方按钮添加吧';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = filtered.map((r, i) => {
    const fromName = r.from_name || '角色#' + r.from_char_id;
    const toName = r.to_name || '角色#' + r.to_char_id;
    const typeHtml = r.relation_type ? `<span class="rel-type ${r.relation_type === 'CP' ? 'rel-type-cp' : r.relation_type === '继承记忆' ? 'rel-type-memory' : r.relation_type === '参与组建' ? 'rel-type-formation' : r.relation_type === '师生' ? 'rel-type-teacher' : ''}">${esc(r.relation_type)}</span>` : '';
    const arrow = ['CP', '朋友', '冤家', '亲属'].includes(r.relation_type) ? '⇄' : '→';
    const checked = selectedIds.has(r.id) ? 'checked' : '';
    const selectedClass = selectedIds.has(r.id) ? ' selected' : '';
    return `
      <div class="rel-item${selectedClass}" id="rel-${r.id}" draggable="true" data-index="${i}" data-id="${r.id}"
           onmouseenter="highlightRelation(${r.id}, true)"
           onmouseleave="highlightRelation(${r.id}, false)"
           ondragstart="onRelDragStart(event, ${i})"
           ondragover="onRelDragOver(event)"
           ondragend="onRelDragEnd(event)"
           ondragenter="onRelDragEnter(event, this)"
           ondragleave="onRelDragLeave(event, this)"
           ondrop="onRelDrop(event, ${i})">
        <input type="checkbox" class="rel-checkbox" ${checked} onchange="toggleCardSelect(${r.id}, this.checked)" onclick="event.stopPropagation()">
        <span class="drag-handle" title="拖动排序">⠿</span>
        <div class="rel-info" onclick="${exportMode ? `toggleCardSelect(${r.id}, !${selectedIds.has(r.id)})` : `openEditModal(${r.id})`}">
          <div class="rel-names">
            ${esc(fromName)} <span class="arrow">${arrow}</span> ${esc(toName)}
            ${typeHtml}
          </div>
          ${r.description ? `<div class="rel-desc">${esc(r.description)}</div>` : ''}
        </div>
        <div class="rel-actions">
          <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openEditModal(${r.id})">编辑</button>
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openDeleteModal(${r.id},'${esc(fromName)}${arrow}${esc(toName)}')">删除</button>
        </div>
      </div>`;
  }).join('');

  if (exportMode) updateExportButtons();
}

function onRelDragStart(e, idx) {
  draggedRelIndex = idx;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
}

function onRelDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function onRelDragEnter(e, el) {
  e.preventDefault();
  if (!el.classList.contains('dragging')) el.classList.add('drag-over');
}

function onRelDragLeave(e, el) {
  el.classList.remove('drag-over');
}

function onRelDrop(e, toIdx) {
  e.preventDefault();
  e.target.closest('.rel-item')?.classList.remove('drag-over');
  if (draggedRelIndex === null || draggedRelIndex === toIdx) return;
  const item = allRelations.splice(draggedRelIndex, 1)[0];
  allRelations.splice(toIdx, 0, item);
  saveRelOrder();
  renderRelList();
  draggedRelIndex = null;
}

function onRelDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.rel-item').forEach(el => el.classList.remove('drag-over'));
  draggedRelIndex = null;
}

async function saveRelOrder() {
  const items = allRelations.map((r, i) => ({ id: r.id, sort_order: i }));
  try {
    await fetch(`${API_REL}/reorder`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items }),
    });
  } catch(e) { /* 静默失败 */ }
}

function highlightRelation(relId, on) {
  const edge = edges.find(e => e.id === relId);
  if (edge) {
    edge.highlight = on;
    if (on) {
      edge._origWidth = 3;
      edge._origAlpha = 0.7;
    }
    drawGraphWithHighlight();
  }
  const item = document.getElementById('rel-' + relId);
  if (item) item.classList.toggle('highlight', on);
}

function drawGraphWithHighlight() {
  ctx.clearRect(0, 0, cw, ch);

  // 背景网格
  ctx.strokeStyle = themeVar('--canvas-grid', '#e8e0d5'); ctx.lineWidth = 0.5;
  for (let x = 40; x < cw; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke(); }
  for (let y = 40; y < ch; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke(); }

  drawFamilyClusters();

  const labelOffsets = computeLabelOffsets(edges);
  edges.forEach((edge, i) => {
    const from = nodes.find(n => n.id === edge.from);
    const to = nodes.find(n => n.id === edge.to);
    if (!from || !to) return;

    const isBidirectional = ['CP', '参与组建', '朋友', '冤家', '亲属'].includes(edge.type);
    const hl = edge.highlight;
    drawEdge(from.x, from.y, to.x, to.y, edge.type, isBidirectional, hl);

    const mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2;
    const dx = to.x - from.x, dy = to.y - from.y;
    const elen = Math.sqrt(dx * dx + dy * dy) || 1;
    const px = -dy / elen, py = dx / elen;
    const off = (labelOffsets[i] || 0) * 15;
    const lx = mx + px * off, ly = my + py * off;
    const label = edge.type;
    let labelColor;
    if (edge.type === 'CP') labelColor = '#c44b7a';
    else if (edge.type === '继承记忆') labelColor = '#2e8b8a';
    else if (edge.type === '参与组建') labelColor = '#d4842a';
    else if (edge.type === '师生') labelColor = '#4a7db0';
    else if (edge.type === '朋友') labelColor = '#2ecc71';
    else if (edge.type === '冤家') labelColor = '#e67e22';
    else if (edge.type === '亲属') labelColor = '#2ecc71';
    else labelColor = '#6b4c8a';
    const tw = ctx.measureText(label).width + 8;
    ctx.fillStyle = hl ? themeVar('--accent-pale','#f0e8f8') : themeVar('--canvas-label-bg','#fff');
    ctx.fillRect(lx - tw/2, ly - 9, tw, 18);
    ctx.strokeStyle = hl ? labelColor + '99' : labelColor + '55';
    ctx.lineWidth = 1;
    ctx.strokeRect(lx - tw/2, ly - 9, tw, 18);
    ctx.fillStyle = labelColor;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, lx, ly);
  });

  nodes.forEach(node => {
    const grad = ctx.createRadialGradient(node.x, node.y, node.r * 0.6, node.x, node.y, node.r + 6);
    if (node.gender === '男') { grad.addColorStop(0, 'rgba(107,76,138,0.4)'); grad.addColorStop(1, 'rgba(107,76,138,0)'); ctx.fillStyle = '#6b4c8a'; }
    else if (node.gender === '女') { grad.addColorStop(0, 'rgba(196,75,122,0.4)'); grad.addColorStop(1, 'rgba(196,75,122,0)'); ctx.fillStyle = '#c44b7a'; }
    else { grad.addColorStop(0, 'rgba(75,138,107,0.4)'); grad.addColorStop(1, 'rgba(75,138,107,0)'); ctx.fillStyle = '#4b8a6b'; }

    ctx.beginPath(); ctx.arc(node.x, node.y, node.r + 6, 0, Math.PI * 2);
    ctx.fillStyle = grad; ctx.fill();

    const bodyGrad = ctx.createLinearGradient(node.x - node.r, node.y - node.r, node.x + node.r, node.y + node.r);
    if (node.gender === '男') { bodyGrad.addColorStop(0, '#8b6fc4'); bodyGrad.addColorStop(1, '#6b4c8a'); }
    else if (node.gender === '女') { bodyGrad.addColorStop(0, '#e07ba4'); bodyGrad.addColorStop(1, '#c44b7a'); }
    else { bodyGrad.addColorStop(0, '#6baf8a'); bodyGrad.addColorStop(1, '#4b8a6b'); }

    ctx.beginPath(); ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad; ctx.fill();
    // 有头像时把裁好的圆形头像贴进节点圆内（保留描边与家族色环）
    const av = avatarCache.get(node.id);
    if (av) {
      ctx.save();
      ctx.beginPath(); ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(av, node.x - node.r, node.y - node.r, node.r * 2, node.r * 2);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();

    // 家族色环
    const famColor = getFamilyColor(node);
    if (famColor) {
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.r + 3, 0, Math.PI * 2);
      ctx.strokeStyle = famColor;
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // 名字位置：有头像 → 圆外下方；无头像 → 圆内（原样式：白字 bold 13px / y-2）。
    if (av) {
      const shortName = node.name.length > 5 ? node.name.substring(0, 4) + '…' : node.name;
      ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = themeVar('--text', '#3d2b1f');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(shortName, node.x, node.y + node.r + 5);
    } else {
      const shortName = node.name.length > 4 ? node.name.substring(0, 4) + '…' : node.name;
      ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(shortName, node.x, node.y - 2);
    }

    const nodeFams2 = getNodeFamilies(node);
    if (nodeFams2.length > 0) {
      ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
      const displayFams = nodeFams2.map(f => f.length > 4 ? f.substring(0, 4) + '…' : f).join('·');
      const famLabel = displayFams.length > 12 ? displayFams.substring(0, 12) + '…' : displayFams;
      ctx.textAlign = 'center';
      if (av) {
        ctx.fillStyle = famColor || themeVar('--text-light', 'rgba(120,100,80,0.75)');
        ctx.textBaseline = 'top';
        ctx.fillText(famLabel, node.x, node.y + node.r + 21);
      } else {
        ctx.fillStyle = famColor || 'rgba(255,255,255,0.7)';
        ctx.textBaseline = 'middle';
        ctx.fillText(famLabel, node.x, node.y + 14);
      }
    }
  });
}

// --- Modal: 添加/编辑 ---
function populateCharSelects() {
  const fromSel = document.getElementById('fromChar');
  const toSel = document.getElementById('toChar');
  const opts = allCharacters.map(c => `<option value="${c.id}">${esc(c.name)}${c.university ? ' · ' + esc(c.university) : ''}</option>`).join('');
  fromSel.innerHTML = opts;
  toSel.innerHTML = opts;
  // 重置搜索输入
  document.getElementById('fromCharSearch').value = '';
  document.getElementById('toCharSearch').value = '';
  filterSelect({value:''}, 'fromChar');
  filterSelect({value:''}, 'toChar');
}

function filterSelect(input, selectId) {
  const sel = document.getElementById(selectId);
  const q = input.value.toLowerCase().trim();
  Array.from(sel.options).forEach(opt => {
    const text = opt.textContent.toLowerCase();
    opt.hidden = q && !text.includes(q);
  });
  // 如果只有一个匹配项且输入非空，自动选中
  const visible = Array.from(sel.options).filter(o => !o.hidden);
  if (q && visible.length === 1 && visible[0].textContent.toLowerCase().includes(q)) {
    sel.value = visible[0].value;
  }
}

function onCharSelect(sel, searchId) {
  // 选中后把角色名填入搜索框，显示所有选项
  const opt = sel.options[sel.selectedIndex];
  if (opt) document.getElementById(searchId).value = opt.textContent.split(' · ')[0];
  Array.from(sel.options).forEach(o => { o.hidden = false; });
}

function openCreateModal() {
  populateCharSelects();
  document.getElementById('modalTitle').textContent = '添加关系';
  document.getElementById('submitBtn').textContent = '确认添加';
  document.getElementById('editId').value = '';
  document.getElementById('relForm').reset();
  if (selectedFromCharId) {
    document.getElementById('fromChar').value = selectedFromCharId;
    const c = allCharacters.find(ch => ch.id === selectedFromCharId);
    if (c) document.getElementById('fromCharSearch').value = c.name;
  }
  document.getElementById('modalOverlay').classList.add('active');
}

function openEditModal(id) {
  // 从已加载的数据中查找，避免请求不存在的单条API
  const r = allRelations.find(rel => rel.id === id);
  if (!r) {
    showToast('未找到关系数据', 'error');
    return;
  }
  populateCharSelects();
  document.getElementById('modalTitle').textContent = '编辑关系';
  document.getElementById('submitBtn').textContent = '保存修改';
  document.getElementById('editId').value = r.id;
  document.getElementById('fromChar').value = r.from_char_id;
  document.getElementById('toChar').value = r.to_char_id;
  // 填入对应角色名称到搜索框
  const fromC = allCharacters.find(c => c.id === r.from_char_id);
  const toC = allCharacters.find(c => c.id === r.to_char_id);
  if (fromC) document.getElementById('fromCharSearch').value = fromC.name;
  if (toC) document.getElementById('toCharSearch').value = toC.name;
  document.getElementById('relType').value = r.relation_type || '';
  document.getElementById('relDesc').value = r.description || '';
  document.getElementById('modalOverlay').classList.add('active');
}

async function submitForm(e) {
  e.preventDefault();
  const form = document.getElementById('relForm');
  if (!form.checkValidity()) { form.reportValidity(); return; }

  const editId = document.getElementById('editId').value;
  const data = {
    from_char_id: parseInt(document.getElementById('fromChar').value),
    to_char_id: parseInt(document.getElementById('toChar').value),
    relation_type: document.getElementById('relType').value,
    description: document.getElementById('relDesc').value.trim(),
  };

  try {
    const url = editId ? `${API_REL}/${editId}` : API_REL;
    const method = editId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!res.ok) { const err = await res.json(); throw new Error(err.detail || '操作失败'); }
    _autoSaveInProgress = true;
    closeModal();
    selectedFromCharId = null;
    loadData();
    showToast(editId ? '关系已更新' : '关系已创建', 'success');
    setTimeout(function() { _autoSaveInProgress = false; }, 800);
  } catch(e) {
    showToast(e.message || '操作失败', 'error');
  }
}

function closeModal() {
  if (_autoSaveInProgress) {
    _autoSaveInProgress = false;
    selectedFromCharId = null;
    document.getElementById('modalOverlay').classList.remove('active');
    return;
  }
  var fromId = document.getElementById('fromChar').value;
  var toId = document.getElementById('toChar').value;
  if (fromId && toId) {
    submitForm({ preventDefault: function() {} });
    setTimeout(function() {
      selectedFromCharId = null;
      document.getElementById('modalOverlay').classList.remove('active');
    }, 500);
    return;
  }
  selectedFromCharId = null;
  document.getElementById('modalOverlay').classList.remove('active');
}

function cancelEdit() {
  _autoSaveInProgress = false;
  selectedFromCharId = null;
  document.getElementById('modalOverlay').classList.remove('active');
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) { closeModal(); selectedFromCharId = null; }
});

// --- Modal: 删除 ---
function openDeleteModal(id, info) {
  deleteTargetId = id;
  document.getElementById('deleteRelInfo').textContent = info;
  document.getElementById('deleteOverlay').classList.add('active');
}

function closeDeleteModal() {
  document.getElementById('deleteOverlay').classList.remove('active');
  deleteTargetId = null;
}

async function confirmDelete() {
  if (!deleteTargetId) return;
  try {
    await fetch(`${API_REL}/${deleteTargetId}`, { method: 'DELETE' });
    closeDeleteModal();
    loadData();
    showToast('关系已删除', 'success');
  } catch(e) {
    showToast('删除失败', 'error');
  }
}

document.getElementById('deleteOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeDeleteModal();
});

// --- 全局键盘 ---
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeModal(); closeDeleteModal(); closeInfoModal(); closeFamilyModal();
    if (exportMode) cancelExport();
  }
});

// ====== 关系类型分类 ======
const REL_TYPES = ['CP', '单箭头', '继承记忆', '参与组建', '师生', '朋友', '冤家', '亲属'];

function buildTypeTabs() {
  const container = document.getElementById('typeTabs');
  if (!container) return;

  // 按数量降序排列
  const counts = {};
  REL_TYPES.forEach(t => { counts[t] = 0; });
  allRelations.forEach(r => {
    if (r.relation_type && counts[r.relation_type] !== undefined) counts[r.relation_type]++;
  });

  // 全部标签
  let html = `<button class="type-tab${activeType === '全部' ? ' active' : ''}" data-type="全部" onclick="selectType('全部')">全部<span class="tab-count">${allRelations.length}</span></button>`;

  // 按数量降序排列类型标签
  const orderedTypes = REL_TYPES.filter(t => counts[t] > 0).sort((a, b) => counts[b] - counts[a]);
  for (const t of orderedTypes) {
    html += `<button class="type-tab${activeType === t ? ' active' : ''}" data-type="${t}" onclick="selectType('${t}')">${t}<span class="tab-count">${counts[t]}</span></button>`;
  }

  container.innerHTML = html;
}

function selectType(type) {
  activeType = type;
  document.querySelectorAll('.type-tab').forEach(tab => tab.classList.remove('active'));
  const tab = document.querySelector(`.type-tab[data-type="${type}"]`);
  if (tab) tab.classList.add('active');
  renderRelList();
}

// ====== 选择导出 ======
function enterExportMode() {
  exportMode = true;
  selectedIds.clear();
  document.body.classList.add('export-mode');
  document.getElementById('exportBtn').style.display = 'none';
  document.getElementById('exportActions').style.display = '';
  renderRelList();
}

function cancelExport() {
  exportMode = false;
  selectedIds.clear();
  document.body.classList.remove('export-mode');
  document.getElementById('exportBtn').style.display = '';
  document.getElementById('exportActions').style.display = 'none';
  renderRelList();
}

function toggleCardSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  const item = document.querySelector(`.rel-item[data-id="${id}"]`);
  if (item) item.classList.toggle('selected', checked);
  updateExportButtons();
}

function toggleSelectAll() {
  const visibleIds = new Set(visibleRelations.map(r => r.id));
  const selectedInView = visibleRelations.filter(r => selectedIds.has(r.id)).length;
  if (selectedInView < visibleRelations.length) {
    visibleRelations.forEach(r => selectedIds.add(r.id));
  } else {
    visibleRelations.forEach(r => selectedIds.delete(r.id));
  }
  renderRelList();
}

function updateExportButtons() {
  const confirmBtn = document.getElementById('confirmExportBtn');
  if (!confirmBtn) return;
  confirmBtn.disabled = selectedIds.size === 0;
  confirmBtn.textContent = selectedIds.size > 0 ? `确认导出 (${selectedIds.size})` : '确认导出';
}

function confirmExport() {
  if (selectedIds.size === 0) return;
  const selected = allRelations.filter(r => selectedIds.has(r.id));
  const exportData = selected.map(r => ({
    角色A: r.from_name || '',
    角色B: r.to_name || '',
    关系类型: r.relation_type || '',
    关系描述: r.description || '',
  }));
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `关系网_${selected.length}条关系_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已导出 ${selected.length} 条关系`, 'success');
  cancelExport();
}

// --- Toast ---
let toastTimer;
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + (type || '') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2500);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ====== 家族管理 ======
function openFamilyModal() {
  familyEditMap = {};
  allCharacters.forEach(c => {
    familyEditMap[c.id] = c.family || '';
  });

  // 收集已有家族作为建议（拆分后的单个家族名）
  const allFams = new Set();
  allCharacters.forEach(c => {
    const fams = splitFamilies(c.family || '');
    fams.forEach(f => allFams.add(f));
  });
  const datalistOpts = [...allFams].map(f => `<option value="${esc(f)}">`).join('');

  const body = document.getElementById('familyBody');
  body.innerHTML = allCharacters.map(c => {
    const fams = splitFamilies(c.family || '');
    const famDots = fams.map(f =>
      `<span class="legend-dot" style="background:${familyColorMap[f] || '#ccc'};border-color:${familyColorMap[f] || '#ccc'};flex-shrink:0;display:inline-block;margin-left:3px;" title="${esc(f)}"></span>`
    ).join('');
    return `
    <div class="form-group" style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
      <span style="min-width:90px;font-weight:600;font-size:.9rem;">${esc(c.name)}</span>
      <input type="text" class="fam-input" data-char-id="${c.id}" value="${esc(c.family || '')}"
             list="famSuggest_${c.id}" placeholder="多个用、分隔…"
             style="flex:1;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:.85rem;font-family:var(--font-sans);">
      <datalist id="famSuggest_${c.id}">${datalistOpts}</datalist>
      <span style="display:flex;gap:2px;flex-shrink:0;">${famDots}</span>
    </div>`;
  }).join('');

  // 绑定事件
  body.querySelectorAll('.fam-input').forEach(input => {
    input.addEventListener('input', function() {
      familyEditMap[parseInt(this.dataset.charId)] = this.value.trim();
    });
  });

  document.getElementById('familyOverlay').classList.add('active');
}

function closeFamilyModal() {
  document.getElementById('familyOverlay').classList.remove('active');
}

async function saveFamilies() {
  const toast = document.getElementById('toast');
  let successCount = 0;
  let failCount = 0;

  for (const charId in familyEditMap) {
    const newFamily = familyEditMap[charId].trim();
    const char = allCharacters.find(c => c.id === parseInt(charId));
    if (!char || (char.family || '').trim() === newFamily) continue;

    try {
      const res = await fetch(`${API_CHAR}/${charId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ family: newFamily }),
      });
      if (res.ok) {
        char.family = newFamily;
        successCount++;
      } else {
        failCount++;
      }
    } catch(e) {
      failCount++;
    }
  }

  closeFamilyModal();
  buildFamilyColors();
  updateFamilyLegend();
  computeLayout();
  drawGraph();
  showToast(`家族更新完成：${successCount} 成功 ${failCount > 0 ? failCount + ' 失败' : ''}`, failCount > 0 ? 'error' : 'success');
}

document.getElementById('familyOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeFamilyModal();
});
